<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C.I.A. — سجل الأفراد والملابس</title>
<style>
  :root{
    --ink:#0A0C0F;
    --panel:#12161B;
    --panel-2:#161B21;
    --line:#2A2F36;
    --gold:#C6A664;
    --gold-dim:#8C743E;
    --red:#9B2226;
    --text:#E7E2D3;
    --muted:#8B93A0;
    --green:#4E8B63;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(198,166,100,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(155,34,38,0.05), transparent 40%),
      var(--ink);
    color:var(--text);
    font-family:'Tahoma','Segoe UI',Arial,sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  .watermark{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0.03; transform:rotate(-18deg);
  }
  .watermark span{
    font-family:Georgia,'Times New Roman',serif;
    font-size:14vw; font-weight:700; letter-spacing:0.05em;
    color:var(--gold); white-space:nowrap;
  }
  .wrap{position:relative; z-index:1; max-width:980px; margin:0 auto; padding:28px 20px 80px;}

  /* header */
  header{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding-bottom:22px; border-bottom:1px solid var(--line); margin-bottom:26px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand .title-block{display:flex; flex-direction:column;}
  .brand .eng{
    font-family:Georgia,'Times New Roman',serif; letter-spacing:0.18em;
    color:var(--gold); font-size:22px; font-weight:700;
  }
  .brand .sub{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .authbox{display:flex; align-items:center; gap:10px;}
  .pill{
    font-size:12px; color:var(--muted); border:1px solid var(--line);
    padding:6px 12px; border-radius:20px; display:flex; align-items:center; gap:8px;
  }
  .pill b{color:var(--gold); font-weight:600;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green);}

  button{
    font-family:inherit; cursor:pointer; border:1px solid var(--gold-dim);
    background:transparent; color:var(--gold); padding:9px 16px; font-size:13.5px;
    letter-spacing:0.03em; transition:all .15s ease; border-radius:3px;
  }
  button:hover{background:rgba(198,166,100,0.1); border-color:var(--gold);}
  button.primary{background:var(--gold); color:#181205; border-color:var(--gold); font-weight:700;}
  button.primary:hover{background:#d8b876;}
  button.danger{border-color:#6b2323; color:#d18a8a;}
  button.danger:hover{background:rgba(155,34,38,0.15); border-color:var(--red);}
  button.ghost{border-color:transparent; color:var(--muted);}
  button.ghost:hover{color:var(--text); background:rgba(255,255,255,0.04);}
  button:disabled{opacity:.4; cursor:not-allowed;}

  /* tabs */
  .tabs{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap;}
  .tab{
    padding:10px 20px; border:1px solid var(--line); border-bottom:none;
    background:var(--panel); color:var(--muted); font-size:13.5px; letter-spacing:.04em;
    border-radius:4px 4px 0 0; cursor:pointer; position:relative; top:1px;
  }
  .tab.active{color:var(--gold); background:var(--panel-2); border-color:var(--gold-dim); border-bottom:1px solid var(--panel-2);}

  .panel{
    background:var(--panel-2); border:1px solid var(--line); border-radius:0 4px 4px 4px;
    padding:22px; min-height:280px;
  }

  .leader-card{
    display:flex; align-items:center; gap:14px; padding:14px 16px; margin-bottom:18px;
    border:1px solid var(--gold-dim); border-radius:4px;
    background:linear-gradient(90deg, rgba(198,166,100,0.08), transparent);
  }
  .leader-card .badge{
    font-family:Georgia,serif; font-size:10.5px; letter-spacing:.12em; color:var(--ink);
    background:var(--gold); padding:4px 9px; border-radius:2px; font-weight:700;
  }
  .leader-card .name{font-size:16px; font-weight:700; color:var(--text);}
  .leader-card .rank{font-size:12.5px; color:var(--muted);}
  .leader-card.empty{color:var(--muted); border-style:dashed; font-size:13px; justify-content:center;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:right; color:var(--gold); font-weight:600; font-size:12px;
    letter-spacing:.05em; padding:8px 10px; border-bottom:1px solid var(--line);
  }
  tbody td{padding:11px 10px; border-bottom:1px solid rgba(255,255,255,0.05); color:var(--text);}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  .leader-tag{
    font-size:10px; color:var(--ink); background:var(--gold); padding:2px 7px;
    border-radius:2px; margin-inline-start:8px; font-weight:700;
  }
  .code-badge{
    font-family:monospace; color:var(--gold); background:rgba(198,166,100,0.1); 
    padding:2px 6px; border-radius:3px; border:1px solid var(--gold-dim);
  }
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .row-actions button{padding:5px 10px; font-size:12px;}
  .empty-row{text-align:center; color:var(--muted); padding:30px 0; font-size:13px;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .toolbar h2{font-size:15px; color:var(--text); font-weight:600;}
  .toolbar .count{color:var(--muted); font-size:12.5px; margin-inline-start:8px;}

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(5,6,8,0.75); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .modal{
    background:var(--panel-2); border:1px solid var(--gold-dim); border-radius:6px;
    width:100%; max-width:420px; padding:26px; position:relative;
  }
  .modal h3{font-size:16px; color:var(--gold); margin-bottom:4px; font-family:Georgia,serif; letter-spacing:.02em;}
  .modal .desc{color:var(--muted); font-size:12.5px; margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px;}
  .field input, .field select{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:3px; font-size:14px; font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--gold);}
  .checkfield{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); margin-bottom:14px;}
  .error-msg{
    background:rgba(155,34,38,0.12); border:1px solid #5c1c1e; color:#e2a3a3;
    padding:9px 12px; border-radius:3px; font-size:12.5px; margin-bottom:14px;
  }
  .success-msg{
    background:rgba(78,139,99,0.12); border:1px solid #2e5b3d; color:#a8d6b6;
    padding:9px 12px; border-radius:3px; font-size:12.5px; margin-bottom:14px;
  }
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:6px;}
  .close-x{position:absolute; top:14px; left:14px; color:var(--muted); background:none; border:none; font-size:18px; padding:2px 8px;}

  .admin-list{max-height:280px; overflow-y:auto; margin-bottom:16px;}
  .admin-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px; border-bottom:1px solid var(--line); font-size:13px;
  }
  .admin-row .email{color:var(--text);}
  .admin-row .flags{display:flex; gap:6px;}
  .tag{font-size:10px; padding:2px 7px; border-radius:2px; border:1px solid var(--line); color:var(--muted);}
  .tag.on{color:var(--gold); border-color:var(--gold-dim);}

  /* Clothes Grid */
  .clothes-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:16px; margin-top:15px;
  }
  .cloth-card{
    background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px;
    display:flex; flex-direction:column; justify-content:space-between; gap:10px;
  }
  .cloth-card h4{color:var(--gold); font-size:15px;}
  .cloth-info{font-size:13px; color:var(--muted);}
  .cloth-info b{color:var(--text);}

  footer{text-align:center; color:var(--muted); font-size:11.5px; margin-top:40px; letter-spacing:.05em;}
  .hidden{display:none !important;}
  ::selection{background:rgba(198,166,100,0.3);}
</style>
</head>
<body>

<div class="watermark"><span>CLASSIFIED</span></div>

<div class="wrap">
  <header>
    <div class="brand">
      <svg width="52" height="52" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="47" fill="none" stroke="#C6A664" stroke-width="1.5" opacity="0.6"/>
        <circle cx="50" cy="50" r="40" fill="none" stroke="#C6A664" stroke-width="1" opacity="0.35" stroke-dasharray="2 3"/>
        <g fill="#C6A664">
          <path d="M50 20 L58 40 L50 34 L42 40 Z"/>
          <path d="M28 42 C28 42 38 36 50 40 C62 36 72 42 72 42 C72 42 65 50 50 48 C35 50 28 42 28 42 Z"/>
          <path d="M50 48 C50 48 46 62 38 68 C38 68 46 66 50 60 C54 66 62 68 62 68 C54 62 50 48 50 48 Z"/>
        </g>
        <path d="M50 8 A42 42 0 0 1 92 50" fill="none" stroke="#C6A664" stroke-width="0.8" opacity="0.5"/>
      </svg>
      <div class="title-block">
        <div class="eng">C.I.A. — C.I.A.</div>
        <div class="sub">cia handbook</div>
      </div>
    </div>
    <div class="authbox" id="authbox"></div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>

  <footer>cia handbook</footer>
</div>

<div id="modalRoot"></div>

<script>
/* ---------------- storage helpers ---------------- */
const DATA_KEY = 'cia-roster-data-v2';
let state = {
  accounts: [], 
  members: [],    // {id, code, name, rank, team, isLeader}
  clothes: [],    // {id, name, size, qty}
  session: null, 
  activeTab: 'roster', // 'roster' OR 'clothes'
  loading: true,
};

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function loadData(){
  try{
    const res = localStorage.getItem(DATA_KEY);
    if(res){
      const parsed = JSON.parse(res);
      state.accounts = parsed.accounts || [];
      state.members = parsed.members || [];
      state.clothes = parsed.clothes || [];
    } else {
      // Seed default admin account
      const defaultHash = await sha256('admin123');
      state.accounts = [{email:'admin@cia.local', hash:defaultHash, canEdit:true, isAdmin:true}];
      state.members = [];
      state.clothes = [];
      saveData();
    }
  }catch(e){
    console.error('storage error', e);
  }
  state.loading = false;
  render();
}

function saveData(){
  try{
    localStorage.setItem(DATA_KEY, JSON.stringify({
      accounts: state.accounts, 
      members: state.members,
      clothes: state.clothes
    }));
  }catch(e){
    console.error('Local Storage error', e);
    alert('تعذّر حفظ البيانات تلقائياً.');
  }
}

/* ---------------- render root ---------------- */
function render(){
  renderAuthBox();
  renderTabs();
  renderPanel();
}

function renderAuthBox(){
  const box = document.getElementById('authbox');
  if(state.loading){ box.innerHTML=''; return; }
  if(!state.session){
    box.innerHTML = `<button class="primary" onclick="openLogin()">تسجيل الدخول</button>`;
    return;
  }
  const s = state.session;
  box.innerHTML = `
    <div class="pill"><span class="dot"></span><b>${escapeHtml(s.email)}</b>${s.isAdmin?' · مدير':(s.canEdit?' · صلاحية تعديل':' · مشاهدة')}</div>
    ${s.isAdmin ? `<button onclick="openAdmin()">إدارة الحسابات</button>` : ''}
    <button class="ghost" onclick="logout()">خروج</button>
  `;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = `
    <div class="tab ${state.activeTab==='roster'?'active':''}" onclick="setTab('roster')">جدول الأفراد الموحد</div>
    <div class="tab ${state.activeTab==='clothes'?'active':''}" onclick="setTab('clothes')">سجل الملابس والمعدات</div>
  `;
}

function setTab(tabName){ state.activeTab = tabName; render(); }

function renderPanel(){
  const panel = document.getElementById('panel');
  if(state.loading){
    panel.innerHTML = `<div class="empty-row">جارٍ تحميل السجل…</div>`;
    return;
  }

  const canEdit = !!(state.session && state.session.canEdit);

  if(state.activeTab === 'roster'){
    // --- عرض جدول الأفراد الموحد ---
    const members = state.members;
    const leader = members.find(m=>m.isLeader);

    const leaderHtml = leader
      ? `<div class="leader-card">
           <span class="badge">القائد العام</span>
           <div><div class="name">${escapeHtml(leader.name)} (${escapeHtml(leader.code)})</div><div class="rank">${escapeHtml(leader.rank||'')} · الفرقة = ${escapeHtml(leader.team)}</div></div>
         </div>`
      : `<div class="leader-card empty">لا يوجد قائد محدد حالياً</div>`;

    const rows = members.length ? members.map(m=>`
        <tr>
          <td><span class="code-badge">${escapeHtml(m.code||'#---')}</span></td>
          <td>${escapeHtml(m.name)} ${m.isLeader?'<span class="leader-tag">قائد</span>':''}</td>
          <td>${escapeHtml(m.rank||'—')}</td>
          <td><b>الفرقة = ${escapeHtml(m.team)}</b></td>
          <td>
            ${canEdit ? `
              <div class="row-actions">
                <button onclick="openEditMember('${m.id}')">تعديل</button>
                <button class="danger" onclick="removeMember('${m.id}')">إزالة</button>
              </div>` : ''}
          </td>
        </tr>
      `).join('')
      : `<tr><td colspan="5" class="empty-row">لا يوجد أفراد مسجلين حتى الآن</td></tr>`;

    panel.innerHTML = `
      ${leaderHtml}
      <div class="toolbar">
        <h2>سجل الأفراد العام <span class="count">(${members.length})</span></h2>
        <div>
          ${canEdit ? `<button class="primary" onclick="openAddMember()">+ إضافة فرد جديد</button>` : ''}
          ${canEdit && members.length ? `<button class="danger" onclick="clearAllMembers()" style="margin-inline-start:8px">حذف جميع الأفراد</button>` : ''}
        </div>
      </div>
      <table>
        <thead><tr><th>الكود</th><th>الاسم</th><th>الرتبة</th><th>الفرقة</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  } 
  else if(state.activeTab === 'clothes') {
    // --- عرض سجل الملابس ---
    const clothes = state.clothes;

    const cardsHtml = clothes.length ? clothes.map(c=>`
      <div class="cloth-card">
        <h4>👕 ${escapeHtml(c.name)}</h4>
        <div class="cloth-info">المقاس: <b>${escapeHtml(c.size)}</b></div>
        <div class="cloth-info">الكمية المتوفرة: <b>${escapeHtml(c.qty)}</b></div>
        ${canEdit ? `<button class="danger" style="width:100%; margin-top:8px;" onclick="removeCloth('${c.id}')">حذف القطعة</button>` : ''}
      </div>
    `).join('') : `<div class="empty-row" style="grid-column:1/-1;">لا يوجد قطب ملابس مسجلة في السجل</div>`;

    panel.innerHTML = `
      <div class="toolbar">
        <h2>قسم الملابس والمعدات <span class="count">(${clothes.length})</span></h2>
        ${canEdit ? `<button class="primary" onclick="openAddCloth()">+ إضافة قطعة ملابس</button>` : ''}
      </div>
      <div class="clothes-grid">
        ${cardsHtml}
      </div>
    `;
  }
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- modals ---------------- */
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function openLogin(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="close-x" onclick="closeModal()">×</button>
        <h3>تسجيل الدخول</h3>
        <div class="desc">أدخل البريد الإلكتروني وكلمة المرور الخاصة بحسابك</div>
        <div id="loginError"></div>
        <div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" placeholder="admin@cia.local"></div>
        <div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" placeholder="••••••••"></div>
        <div class="modal-actions">
          <button class="ghost" onclick="closeModal()">إلغاء</button>
          <button class="primary" onclick="doLogin()">دخول</button>
        </div>
      </div>
    </div>
  `;
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginError');
  errBox.innerHTML = '';
  if(!email || !pass){
    errBox.innerHTML = `<div class="error-msg">الرجاء تعبئة البريد الإلكتروني وكلمة المرور</div>`;
    return;
  }
  const acc = state.accounts.find(a=>a.email.toLowerCase()===email);
  if(!acc){
    errBox.innerHTML = `<div class="error-msg">البريد الإلكتروني غير صحيح</div>`;
    return;
  }
  const hash = await sha256(pass);
  if(hash !== acc.hash){
    errBox.innerHTML = `<div class="error-msg">كلمة المرور غير صحيحة</div>`;
    return;
  }
  state.session = {email: acc.email, canEdit: acc.canEdit, isAdmin: acc.isAdmin};
  closeModal();
  render();
}

function logout(){ state.session = null; render(); }

/* ---------------- الأفراد ---------------- */
function openAddMember(){ renderMemberModal(null); }
function openEditMember(id){
  const m = state.members.find(x=>x.id===id);
  if(m) renderMemberModal(m);
}

function renderMemberModal(existing){
  const isEdit = !!existing;
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="close-x" onclick="closeModal()">×</button>
        <h3>${isEdit?'تعديل بيانات الفرد':'إضافة فرد جديد'}</h3>
        <div class="desc">أدخل كود الفرد وبياناته للحفظ التلقائي في السجل</div>
        <div class="field"><label>كود / رمز الفرد (مطلوب)</label><input id="mCode" value="${isEdit?escapeHtml(existing.code||''):''}" placeholder="مثال: #101 أو C-07"></div>
        <div class="field"><label>اسم الفرد</label><input id="mName" value="${isEdit?escapeHtml(existing.name):''}" placeholder="اسم الفرد"></div>
        <div class="field"><label>الرتبة</label><input id="mRank" value="${isEdit?escapeHtml(existing.rank||''):''}" placeholder="مثال: قائد ميداني"></div>
        <div class="field"><label>الفرقة</label>
          <input id="mTeam" value="${isEdit?escapeHtml(existing.team||''):''}" placeholder="مثال: DO أو SOG أو الفرقة الأولى">
        </div>
        <div class="checkfield">
          <input type="checkbox" id="mLeader" ${isEdit&&existing.isLeader?'checked':''}>
          <label for="mLeader">تعيين هذا الفرد كقائد عام</label>
        </div>
        <div class="modal-actions">
          <button class="ghost" onclick="closeModal()">إلغاء</button>
          <button class="primary" onclick="saveMember(${isEdit?`'${existing.id}'`:'null'})">حفظ البيانات</button>
        </div>
      </div>
    </div>
  `;
}

function saveMember(id){
  const code = document.getElementById('mCode').value.trim();
  const name = document.getElementById('mName').value.trim();
  const rank = document.getElementById('mRank').value.trim();
  const team = document.getElementById('mTeam').value.trim() || 'عامة';
  const isLeader = document.getElementById('mLeader').checked;

  if(!code){ alert('الرجاء كتابة كود الفرد'); return; }
  if(!name){ alert('الرجاء إدخال اسم الفرد'); return; }

  if(isLeader){
    state.members.forEach(m => m.isLeader = false);
  }

  if(id){
    const m = state.members.find(x=>x.id===id);
    Object.assign(m, {code, name, rank, team, isLeader});
  } else {
    state.members.push({id: 'm_'+Date.now(), code, name, rank, team, isLeader});
  }

  saveData();
  closeModal();
  render();
}

function removeMember(id){
  if(!confirm('هل أنت متأكد من إزالة هذا الفرد من السجل؟')) return;
  state.members = state.members.filter(m=>m.id!==id);
  saveData();
  render();
}

function clearAllMembers(){
  if(!confirm('تحذير: هل أنت متأكد من حذف جميع الأفراد في الجدول؟')) return;
  state.members = [];
  saveData();
  render();
}

/* ---------------- الملابس ---------------- */
function openAddCloth(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="close-x" onclick="closeModal()">×</button>
        <h3>إضافة قطعة ملابس / معدات</h3>
        <div class="desc">سيتم تسجيل القطعة ومزامنتها في السجل</div>
        <div class="field"><label>اسم القطعة</label><input id="cName" placeholder="مثال: سترة تكتيكية سوداء"></div>
        <div class="field"><label>المقاس</label>
          <select id="cSize">
            <option value="Small (S)">Small (S)</option>
            <option value="Medium (M)" selected>Medium (M)</option>
            <option value="Large (L)">Large (L)</option>
            <option value="X-Large (XL)">X-Large (XL)</option>
            <option value="Free Size">مقاس موحد</option>
          </select>
        </div>
        <div class="field"><label>الكمية المتوفرة</label><input id="cQty" type="number" value="1" min="1"></div>
        <div class="modal-actions">
          <button class="ghost" onclick="closeModal()">إلغاء</button>
          <button class="primary" onclick="saveCloth()">إضافة للقسم</button>
        </div>
      </div>
    </div>
  `;
}

function saveCloth(){
  const name = document.getElementById('cName').value.trim();
  const size = document.getElementById('cSize').value;
  const qty = document.getElementById('cQty').value;

  if(!name){ alert('الرجاء إدخال اسم القطعة'); return; }

  state.clothes.push({ id: 'c_'+Date.now(), name, size, qty });
  saveData();
  closeModal();
  render();
}

function removeCloth(id){
  if(!confirm('حذف هذه القطعة من سجل الملابس؟')) return;
  state.clothes = state.clothes.filter(c=>c.id!==id);
  saveData();
  render();
}

/* ---------------- إدارة الحسابات ---------------- */
function openAdmin(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:480px;">
        <button class="close-x" onclick="closeModal()">×</button>
        <h3>إدارة الحسابات والصلاحيات</h3>
        <div class="desc">إضافة وإدارة من يحق لهم التعديل على السجل</div>
        <div class="admin-list" id="adminList"></div>
        <div class="field"><label>بريد إلكتروني جديد</label><input id="newEmail" type="email" placeholder="user@cia.local"></div>
        <div class="field"><label>كلمة المرور</label><input id="newPass" type="password" placeholder="••••••••"></div>
        <div class="checkfield"><input type="checkbox" id="newCanEdit" checked><label for="newCanEdit">صلاحية تعديل الجدول والملابس</label></div>
        <div class="checkfield"><input type="checkbox" id="newIsAdmin"><label for="newIsAdmin">صلاحية مدير (إدارة الحسابات)</label></div>
        <div id="adminError"></div>
        <div class="modal-actions">
          <button class="ghost" onclick="closeModal()">إغلاق</button>
          <button class="primary" onclick="addAccount()">إضافة الحساب</button>
        </div>
      </div>
    </div>
  `;
  renderAdminList();
}

function renderAdminList(){
  const list = document.getElementById('adminList');
  if(!list) return;
  list.innerHTML = state.accounts.map(a=>`
    <div class="admin-row">
      <div class="email">${escapeHtml(a.email)}</div>
      <div class="flags">
        <span class="tag ${a.canEdit?'on':''}" style="cursor:pointer" onclick="toggleFlag('${a.email}','canEdit')">تعديل</span>
        <span class="tag ${a.isAdmin?'on':''}" style="cursor:pointer" onclick="toggleFlag('${a.email}','isAdmin')">مدير</span>
        <button class="ghost" style="padding:3px 8px;font-size:11px" onclick="removeAccount('${a.email}')">حذف</button>
      </div>
    </div>
  `).join('');
}

async function toggleFlag(email, flag){
  const acc = state.accounts.find(a=>a.email===email);
  if(!acc) return;
  if(acc.email===state.session.email && flag==='isAdmin' && acc.isAdmin){
    alert('لا يمكنك إزالة صلاحية المدير عن حسابك الحالي');
    return;
  }
  acc[flag] = !acc[flag];
  saveData();
  if(state.session && state.session.email===acc.email){
    state.session.canEdit = acc.canEdit; state.session.isAdmin = acc.isAdmin;
  }
  renderAdminList();
  render();
}

function removeAccount(email){
  if(email===state.session.email){ alert('لا يمكنك حذف حسابك الحالي'); return; }
  if(!confirm('حذف هذا الحساب؟')) return;
  state.accounts = state.accounts.filter(a=>a.email!==email);
  saveData();
  renderAdminList();
}

async function addAccount(){
  const email = document.getElementById('newEmail').value.trim().toLowerCase();
  const pass = document.getElementById('newPass').value;
  const canEdit = document.getElementById('newCanEdit').checked;
  const isAdmin = document.getElementById('newIsAdmin').checked;
  const errBox = document.getElementById('adminError');
  errBox.innerHTML = '';
  if(!email || !pass){ errBox.innerHTML = `<div class="error-msg">أدخل البريد وكلمة المرور</div>`; return; }
  if(state.accounts.find(a=>a.email===email)){ errBox.innerHTML = `<div class="error-msg">هذا البريد مسجل مسبقاً</div>`; return; }
  const hash = await sha256(pass);
  state.accounts.push({email, hash, canEdit, isAdmin});
  saveData();
  document.getElementById('newEmail').value='';
  document.getElementById('newPass').value='';
  errBox.innerHTML = `<div class="success-msg">تمت إضافة الحساب بنجاح</div>`;
  renderAdminList();
}

/* ---------------- init ---------------- */
loadData();
</script>
</body>
</html>
