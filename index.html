<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C.I.A. — نظام الإدارة الموحد</title>
<style>
  :root{
    --ink:#0A0C0F;
    --panel:#12161B;
    --panel-2:#161B21;
    --line:#2A2F36;
    --gold:#C6A664;
    --gold-dim:#8C743E;
    --red:#9B2226;
    --text:#E7E2D3;
    --muted:#8B93A0;
    --green:#4E8B63;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(circle at 15% 10%, rgba(198,166,100,0.05), transparent 40%), var(--ink);
    color:var(--text); font-family:'Tahoma','Segoe UI',Arial,sans-serif; min-height:100vh; position:relative; overflow-x:hidden;
  }
  .wrap{position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:28px 20px 80px;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding-bottom:22px; border-bottom:1px solid var(--line); margin-bottom:26px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand .eng{font-family:Georgia,serif; letter-spacing:0.18em; color:var(--gold); font-size:22px; font-weight:700;}
  .brand .sub{color:var(--muted); font-size:12.5px; margin-top:2px;}
  
  .authbox{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .pill{font-size:12px; color:var(--muted); border:1px solid var(--line); padding:6px 12px; border-radius:20px; display:flex; align-items:center; gap:8px;}
  .pill b{color:var(--gold); font-weight:600;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green);}

  button{
    font-family:inherit; cursor:pointer; border:1px solid var(--gold-dim);
    background:transparent; color:var(--gold); padding:8px 14px; font-size:13px;
    letter-spacing:0.03em; transition:all .15s ease; border-radius:3px;
  }
  button:hover{background:rgba(198,166,100,0.1); border-color:var(--gold);}
  button.primary{background:var(--gold); color:#181205; border-color:var(--gold); font-weight:700;}
  button.primary:hover{background:#d8b876;}
  button.danger{border-color:#6b2323; color:#d18a8a;}
  button.danger:hover{background:rgba(155,34,38,0.15); border-color:var(--red);}
  button.ghost{border-color:transparent; color:var(--muted);}
  button.ghost:hover{color:var(--text); background:rgba(255,255,255,0.04);}

  .tabs{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap;}
  .tab{
    padding:10px 20px; border:1px solid var(--line); border-bottom:none;
    background:var(--panel); color:var(--muted); font-size:13.5px;
    border-radius:4px 4px 0 0; cursor:pointer; position:relative; top:1px;
  }
  .tab.active{color:var(--gold); background:var(--panel-2); border-color:var(--gold-dim); border-bottom:1px solid var(--panel-2);}

  .panel{background:var(--panel-2); border:1px solid var(--line); border-radius:0 4px 4px 4px; padding:22px; min-height:300px;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .toolbar h2{font-size:16px; color:var(--text); font-weight:600;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{text-align:right; color:var(--gold); font-weight:600; font-size:12px; padding:10px; border-bottom:1px solid var(--line);}
  tbody td{padding:12px 10px; border-bottom:1px solid rgba(255,255,255,0.05); color:var(--text);}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  .code-badge{font-family:monospace; color:var(--gold); background:rgba(198,166,100,0.1); padding:2px 6px; border-radius:3px; border:1px solid var(--gold-dim);}

  .clothes-grid{display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:16px; margin-top:15px;}
  .cloth-card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; display:flex; flex-direction:column; gap:8px;}
  .cloth-card img{width:100%; height:160px; object-fit:cover; border-radius:4px; border:1px solid var(--line);}
  .cloth-card h4{color:var(--gold); font-size:14px;}

  .overlay{position:fixed; inset:0; background:rgba(5,6,8,0.85); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;}
  .modal{background:var(--panel-2); border:1px solid var(--gold-dim); border-radius:6px; width:100%; max-width:440px; padding:24px; position:relative;}
  .modal h3{font-size:16px; color:var(--gold); margin-bottom:14px; font-family:Georgia,serif;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px;}
  .field input, .field select{width:100%; background:var(--ink); border:1px solid var(--line); color:var(--text); padding:9px 11px; border-radius:3px; font-size:13.5px;}
  .field input:focus{outline:none; border-color:var(--gold);}
  .checkfield{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); margin:12px 0;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:18px;}
  .close-x{position:absolute; top:12px; left:12px; color:var(--muted); background:none; border:none; font-size:18px; cursor:pointer;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="title-block">
        <div class="eng">C.I.A. — SYSTEM</div>
        <div class="sub">سجل مباشر - متزامن سحابياً</div>
      </div>
    </div>
    <div class="authbox" id="authbox"></div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>

<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, set, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBTTj1ww1VPYIHu1SyMg_KSYHZRcF8dRHI",
  authDomain: "swat-system-384b0.firebaseapp.com",
  databaseURL: "https://swat-system-384b0-default-rtdb.firebaseio.com",
  projectId: "swat-system-384b0",
  storageBucket: "swat-system-384b0.firebasestorage.app",
  messagingSenderId: "874029124115",
  appId: "1:874029124115:web:27657c0137fe73ec50cde6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// استرجاع الحساب من المتصفح عند التحديث
const savedUser = JSON.parse(localStorage.getItem('cia_current_user') || 'null');

window.state = {
  currentUser: savedUser,
  accounts: [],
  members: [],
  clothes: [],
  activeTab: 'roster'
};

// إنشاء حساب المسؤول الأساسي إن لم يكن موجوداً
onValue(ref(db, 'accounts'), (snapshot) => {
  const data = snapshot.val();
  if(!data) {
    const adminRef = push(ref(db, 'accounts'));
    set(adminRef, { email: "admin@cia.com", pass: "admin123", isAdmin: true });
  } else {
    state.accounts = Object.keys(data).map(k => ({ id: k, ...data[k] }));
    render();
  }
});

onValue(ref(db, 'members'), (snapshot) => {
  const data = snapshot.val();
  state.members = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
  render();
});

onValue(ref(db, 'clothes'), (snapshot) => {
  const data = snapshot.val();
  state.clothes = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
  render();
});

function renderAuthBox(){
  const box = document.getElementById('authbox');
  if(state.currentUser){
    box.innerHTML = `
      <div class="pill"><span class="dot"></span><b>${escapeHtml(state.currentUser.email)} (${state.currentUser.isAdmin ? 'مسؤول' : 'عضو'})</b></div>
      ${state.currentUser.isAdmin ? `<button onclick="openManageAccountsModal()">إدارة الحسابات</button>` : ''}
      <button class="ghost" onclick="logout()">خروج</button>
    `;
  } else {
    box.innerHTML = `<button class="primary" onclick="openLoginModal()">تسجيل الدخول</button>`;
  }
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = `
    <div class="tab ${state.activeTab==='roster'?'active':''}" onclick="setTab('roster')">جدول الأفراد الموحد</div>
    <div class="tab ${state.activeTab==='clothes'?'active':''}" onclick="setTab('clothes')">سجل الملابس والمعدات</div>
  `;
}

window.setTab = (t) => { state.activeTab = t; render(); };

function renderPanel(){
  const panel = document.getElementById('panel');
  const isLogged = !!state.currentUser;

  if(state.activeTab === 'roster'){
    const rows = state.members.map(m => `
      <tr>
        <td><span class="code-badge">${escapeHtml(m.code)}</span></td>
        <td>${escapeHtml(m.name)}</td>
        <td>${escapeHtml(m.rank)}</td>
        <td>${escapeHtml(m.team)}</td>
        <td>
          ${isLogged ? `
            <button onclick="openEditMember('${m.id}')">تعديل</button>
            <button class="danger" onclick="removeMember('${m.id}')">حذف</button>
          ` : '—'}
        </td>
      </tr>
    `).join('');

    panel.innerHTML = `
      <div class="toolbar">
        <h2>جدول الأفراد (${state.members.length})</h2>
        ${isLogged ? `<button class="primary" onclick="openAddMember()">+ إضافة فرد جديد</button>` : ''}
      </div>
      <table>
        <thead><tr><th>الكود</th><th>الاسم</th><th>الرتبة</th><th>الفرقة</th><th>إجراءات</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" style="text-align:center;">لا يوجد أفراد مسجلين</td></tr>'}</tbody>
      </table>
    `;
  } else if(state.activeTab === 'clothes'){
    const cards = state.clothes.map(c => `
      <div class="cloth-card">
        <img src="${c.image || 'https://via.placeholder.com/150'}" alt="صورة اللبس">
        <h4>${escapeHtml(c.name)}</h4>
        <div>الكود: <span class="code-badge">${escapeHtml(c.code)}</span></div>
        ${isLogged ? `<button class="danger" onclick="removeCloth('${c.id}')" style="margin-top:5px;">حذف</button>` : ''}
      </div>
    `).join('');

    panel.innerHTML = `
      <div class="toolbar">
        <h2>قائمة الملابس والمعدات (${state.clothes.length})</h2>
        ${isLogged ? `<button class="primary" onclick="openAddCloth()">+ إضافة لبس جديد</button>` : ''}
      </div>
      <div class="clothes-grid">${cards || '<div style="grid-column:1/-1; text-align:center;">لا يوجد ملابس مسجلة</div>'}</div>
    `;
  }
}

function render(){ renderAuthBox(); renderTabs(); renderPanel(); }

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
window.closeModal = () => { document.getElementById('modalRoot').innerHTML = ''; };

// تسجيل الدخول
window.openLoginModal = () => {
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="close-x" onclick="closeModal()">×</button>
        <h3>تسجيل الدخول</h3>
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="lEmail"></div>
        <div class="field"><label>كلمة المرور</label><input type="password" id="lPass"></div>
        <div class="modal-actions">
          <button class="primary" onclick="processLogin()">دخول</button>
        </div>
      </div>
    </div>
  `;
};

window.processLogin = () => {
  const email = document.getElementById('lEmail').value.trim();
  const pass = document.getElementById('lPass').value;
  const acc = state.accounts.find(a => a.email === email && a.pass === pass);
  if(acc){
    state.currentUser = acc;
    localStorage.setItem('cia_current_user', JSON.stringify(acc));
    closeModal(); render();
  } else {
    alert("البريد أو كلمة المرور غير صحيحة!");
  }
};

window.logout = () => {
  state.currentUser = null;
  localStorage.removeItem('cia_current_user');
  render();
};

// إدارة الحسابات (للمسؤول فقط)
window.openManageAccountsModal = () => {
  const rows = state.accounts.map(a => `
    <tr>
      <td>${escapeHtml(a.email)}</td>
      <td>${a.isAdmin ? 'مسؤول' : 'عضو'}</td>
      <td>${a.email !== 'admin@cia.com' ? `<button class="danger" onclick="removeAccount('${a.id}')">حذف</button>` : 'أساسي'}</td>
    </tr>
  `).join('');

  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:550px;">
        <button class="close-x" onclick="closeModal()">×</button>
        <h3>إدارة الحسابات المسجلة</h3>
        <div class="field"><label>البريد الجديد</label><input type="email" id="newAccEmail"></div>
        <div class="field"><label>كلمة المرور</label><input type="password" id="newAccPass"></div>
        <div class="checkfield">
          <input type="checkbox" id="newAccIsAdmin">
          <label for="newAccIsAdmin">هل تبيه مسؤول على إدارة الحسابات؟</label>
        </div>
        <button class="primary" onclick="addAccount()" style="width:100%; margin-bottom:15px;">+ إضافة حساب جديد</button>
        <table>
          <thead><tr><th>البريد</th><th>الصلاحية</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
};

window.addAccount = async () => {
  const email = document.getElementById('newAccEmail').value.trim();
  const pass = document.getElementById('newAccPass').value;
  const isAdmin = document.getElementById('newAccIsAdmin').checked;
  if(!email || !pass) return alert("أدخل البريد والباسورد");

  const newRef = push(ref(db, 'accounts'));
  await set(newRef, { email, pass, isAdmin });
  openManageAccountsModal();
};

window.removeAccount = async (id) => {
  if(confirm('حذف هذا الحساب؟')){
    await remove(ref(db, `accounts/${id}`));
    openManageAccountsModal();
  }
};

// إدارة الأفراد
window.openAddMember = () => renderMemberModal(null);
window.openEditMember = (id) => renderMemberModal(state.members.find(m => m.id === id));

function renderMemberModal(existing){
  const isEdit = !!existing;
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="close-x" onclick="closeModal()">×</button>
        <h3>${isEdit ? 'تعديل بيانات الفرد' : 'إضافة فرد جديد'}</h3>
        <div class="field"><label>الكود</label><input id="mCode" value="${isEdit?escapeHtml(existing.code):''}"></div>
        <div class="field"><label>الاسم</label><input id="mName" value="${isEdit?escapeHtml(existing.name):''}"></div>
        <div class="field"><label>الرتبة</label><input id="mRank" value="${isEdit?escapeHtml(existing.rank):''}"></div>
        <div class="field"><label>الفرقة</label><input id="mTeam" value="${isEdit?escapeHtml(existing.team):''}"></div>
        <div class="modal-actions">
          <button class="ghost" onclick="closeModal()">إلغاء</button>
          <button class="primary" onclick="saveMember('${isEdit?existing.id:''}')">حفظ سحابي</button>
        </div>
      </div>
    </div>
  `;
}

window.saveMember = async (id) => {
  const code = document.getElementById('mCode').value.trim();
  const name = document.getElementById('mName').value.trim();
  const rank = document.getElementById('mRank').value.trim();
  const team = document.getElementById('mTeam').value.trim();
  if(!code || !name) return alert('أدخل الكود والاسم');

  const payload = { code, name, rank, team };
  if(id){
    await set(ref(db, `members/${id}`), payload);
  } else {
    await set(push(ref(db, 'members')), payload);
  }
  closeModal();
};

window.removeMember = async (id) => {
  if(confirm('حذف هذا الفرد؟')) await remove(ref(db, `members/${id}`));
};

// إضافة ملابس
window.openAddCloth = () => {
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="close-x" onclick="closeModal()">×</button>
        <h3>إضافة لبس جديد</h3>
        <div class="field"><label>اسم اللبس</label><input id="cName"></div>
        <div class="field"><label>كود اللبس</label><input id="cCode"></div>
        <div class="field"><label>صورة اللبس</label><input type="file" id="cImg" accept="image/*"></div>
        <div class="modal-actions">
          <button class="primary" onclick="saveCloth()">حفظ</button>
        </div>
      </div>
    </div>
  `;
};

window.saveCloth = async () => {
  const name = document.getElementById('cName').value.trim();
  const code = document.getElementById('cCode').value.trim();
  const imgInput = document.getElementById('cImg');

  if(!name || !code || !imgInput.files[0]) return alert('يرجى تعبئة كافة الحقول واختيار صورة');

  const reader = new FileReader();
  reader.onload = async function(e) {
    const imageData = e.target.result;
    await set(push(ref(db, 'clothes')), { name, code, image: imageData });
    closeModal();
  };
  reader.readAsDataURL(imgInput.files[0]);
};

window.removeCloth = async (id) => {
  if(confirm('حذف هذا اللبس؟')) await remove(ref(db, `clothes/${id}`));
};

render();
</script>
</body>
</html>
