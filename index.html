<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C.I.A. — ملف العمليات المشترك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Tajawal:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0b0d09; --panel:#12140f; --panel-2:#181b13;
    --paper:#e7e2d2; --olive:#4a5240; --olive-2:#6b7657;
    --amber:#c8962c; --redacted:#7d1f1f; --green-ok:#5c8a4a;
    --line:#3a3f2f; --text-dim:#9aa088;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at 20% 0%, rgba(200,150,44,0.06), transparent 55%),
                radial-gradient(ellipse at 80% 100%, rgba(74,82,64,0.10), transparent 55%),
                var(--ink);
    color:var(--paper); font-family:'Tajawal', sans-serif;
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none; z-index:1;
  }
  header{
    position:relative; padding:26px 28px 20px; border-bottom:2px solid var(--olive);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:18px;}
  .seal-wrap{ width:72px; height:72px; flex:none; display:flex; align-items:center; justify-content:center; }
  .seal-icon{ width:100%; height:100%; filter: drop-shadow(0 0 6px rgba(200,150,44,0.3)); }
  .brand-text .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:3px; color:var(--amber); text-transform:uppercase; }
  .brand-text h1{ font-family:'Cairo', sans-serif; font-weight:900; font-size:26px; margin:2px 0 0; color:var(--paper); }
  .brand-text .sub{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-dim); margin-top:3px; }
  .stamp{ font-family:'IBM Plex Mono', monospace; border:2px solid var(--redacted); color:var(--redacted); padding:8px 14px; font-weight:600; font-size:12px; letter-spacing:3px; transform:rotate(-4deg); border-radius:3px; }

  nav{ display:flex; gap:6px; padding:0 24px; margin-top:18px; position:relative; z-index:2; }
  .tab{ font-family:'Cairo', sans-serif; font-weight:600; font-size:14.5px; background:var(--panel-2); color:var(--text-dim); border:1px solid var(--line); border-bottom:none; padding:11px 22px; border-radius:8px 8px 0 0; cursor:pointer; }
  .tab.active{ background:var(--panel); color:var(--amber); border-color:var(--olive); }

  main{ padding:0 24px 60px; position:relative; z-index:2; }
  .sheet{ background:var(--panel); border:1px solid var(--olive); border-radius:0 10px 10px 10px; padding:26px; max-width:1100px; margin:0 auto; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; border-bottom:1px dashed var(--line); padding-bottom:14px; }
  .btn{ font-family:'Cairo', sans-serif; font-weight:700; font-size:13.5px; background:var(--olive); color:var(--paper); border:1px solid var(--olive-2); padding:10px 20px; border-radius:6px; cursor:pointer; }
  .btn.amber{ background:transparent; border-color:var(--amber); color:var(--amber); }
  .btn.danger{ background:transparent; border:1px solid var(--redacted); color:#e08787; padding:6px 14px; font-size:12px; }

  table{ width:100%; border-collapse:collapse; }
  thead th{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--amber); text-align:right; padding:10px 12px; border-bottom:2px solid var(--olive); }
  tbody td{ padding:13px 12px; border-bottom:1px solid var(--line); font-size:14.5px; }

  .chat-box{ display:flex; flex-direction:column; height:480px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); }
  .chat-log{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .chat-msg{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; max-width:78%; }
  .chat-input-row{ display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  .chat-input-row input[type=text]{ flex:1; background:var(--ink); border:1px solid var(--line); color:var(--paper); padding:10px; border-radius:6px; outline:none; }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:100; }
  .overlay.show{ display:flex; }
  .modal{ background:var(--panel-2); border:1px solid var(--olive); border-radius:10px; padding:26px; width:min(400px, 92vw); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select{ width:100%; background:var(--ink); border:1px solid var(--line); color:var(--paper); padding:10px; border-radius:6px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="seal-wrap">
      <svg class="seal-icon" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="44" fill="#181b13" stroke="#c8962c" stroke-width="3"/>
        <path d="M 50,18 C 30,18 20,32 20,50 C 20,68 30,82 50,82 Z" fill="#c8962c"/>
        <line x1="18" y1="50" x2="82" y2="50" stroke="#c8962c" stroke-width="3"/>
      </svg>
    </div>
    <div class="brand-text">
      <div class="eyebrow">SWAT SYSTEM</div>
      <h1>C.I.A. — السجل المباشر التفاعلي</h1>
    </div>
  </div>
  <div class="stamp">TOP SECRET</div>
</header>

<nav>
  <div class="tab active" data-page="roster">الجدول المشترك</div>
  <div class="tab" data-page="chat">الدردشة التكتيكية</div>
</nav>

<main>
  <!-- ROSTER PAGE -->
  <section class="sheet" id="page-roster">
    <div class="sheet-head">
      <h2>قائمة العملاء (مباشر للجميع)</h2>
      <button class="btn amber" id="openAdd">＋ إضافة عميل</button>
    </div>
    <table>
      <thead>
        <tr><th>الاسم</th><th>الرتبة</th><th>الوحدة</th><th>الكود</th><th>إجراءات</th></tr>
      </thead>
      <tbody id="rosterBody"></tbody>
    </table>
  </section>

  <!-- CHAT PAGE -->
  <section class="sheet" id="page-chat" style="display:none;">
    <div class="sheet-head"><h2>الدردشة العامة التفاعلية</h2></div>
    <div class="chat-box">
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input-row">
        <input type="text" id="chatText" placeholder="اكتب رسالة للجميع...">
        <button class="btn amber" id="chatSendBtn">إرسال</button>
      </div>
    </div>
  </section>
</main>

<!-- ADD MODAL -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <h3>إضافة عميل جديد</h3>
    <div class="field"><label>الاسم</label><input type="text" id="fName"></div>
    <div class="field"><label>الرتبة</label><input type="text" id="fRank"></div>
    <div class="field"><label>الوحدة</label><input type="text" id="fUnit"></div>
    <div class="field"><label>الكود</label><input type="text" id="fCode"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn amber" id="formSave" style="flex:1;">حفظ</button>
      <button class="btn danger" id="formCancel" style="flex:1;">إلغاء</button>
    </div>
  </div>
</div>

<script type="module">
  // استيراد أدوات Firebase للإصدار 9
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  // إعداداتك الخاصة (تمت إضافة رابط قاعدة البيانات ليعمل Realtime)
  const firebaseConfig = {
    apiKey: "AIzaSyBTTj1ww1VPYIHu1SyMg_KSYHZRcF8dRHI",
    authDomain: "swat-system-384b0.firebaseapp.com",
    projectId: "swat-system-384b0",
    storageBucket: "swat-system-384b0.firebasestorage.app",
    messagingSenderId: "874029124115",
    appId: "1:874029124115:web:27657c0137fe73ec50cde6",
    measurementId: "G-MVNRHGCGZE",
    databaseURL: "https://swat-system-384b0-default-rtdb.firebaseio.com" 
  };

  // تهيئة النظام
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // التنقل بين الصفحات
  const tabs = document.querySelectorAll('nav .tab');
  tabs.forEach(t => {
    t.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('page-roster').style.display = t.dataset.page === 'roster' ? 'block' : 'none';
      document.getElementById('page-chat').style.display = t.dataset.page === 'chat' ? 'block' : 'none';
    });
  });

  // مزامنة الجدول (مباشر)
  const rosterBody = document.getElementById('rosterBody');
  onValue(ref(db, 'roster'), (snapshot) => {
    const data = snapshot.val();
    rosterBody.innerHTML = '';
    if (!data) return;
    Object.keys(data).forEach(key => {
      const item = data[key];
      rosterBody.innerHTML += `
        <tr>
          <td>${item.name}</td>
          <td>${item.rank}</td>
          <td>${item.unit}</td>
          <td>${item.code}</td>
          <td><button class="btn danger" onclick="window.deleteAgent('${key}')">حذف</button></td>
        </tr>`;
    });
  });

  // إضافة عميل
  const formOverlay = document.getElementById('formOverlay');
  document.getElementById('openAdd').onclick = () => formOverlay.classList.add('show');
  document.getElementById('formCancel').onclick = () => formOverlay.classList.remove('show');

  document.getElementById('formSave').onclick = () => {
    const name = document.getElementById('fName').value.trim();
    const rank = document.getElementById('fRank').value.trim();
    const unit = document.getElementById('fUnit').value.trim();
    const code = document.getElementById('fCode').value.trim();
    if (!name || !rank) return;

    push(ref(db, 'roster'), { name, rank, unit, code });
    
    // تفريغ الحقول وإغلاق النافذة
    document.getElementById('fName').value = '';
    document.getElementById('fRank').value = '';
    document.getElementById('fUnit').value = '';
    document.getElementById('fCode').value = '';
    formOverlay.classList.remove('show');
  };

  // دالة الحذف (متاحة للـ Window لكي يعمل زر الحذف)
  window.deleteAgent = function(key) {
    remove(ref(db, 'roster/' + key));
  };

  // مزامنة الدردشة (مباشر)
  const chatLog = document.getElementById('chatLog');
  onValue(ref(db, 'chat'), (snapshot) => {
    const data = snapshot.val();
    chatLog.innerHTML = '';
    if (!data) return;
    Object.keys(data).forEach(key => {
      const m = data[key];
      chatLog.innerHTML += `<div class="chat-msg"><div class="txt">${m.text}</div></div>`;
    });
    chatLog.scrollTop = chatLog.scrollHeight;
  });

  // إرسال رسالة
  document.getElementById('chatSendBtn').onclick = () => {
    const txt = document.getElementById('chatText').value.trim();
    if (!txt) return;
    push(ref(db, 'chat'), { text: txt, time: Date.now() });
    document.getElementById('chatText').value = '';
  };
</script>
</body>
</html>
